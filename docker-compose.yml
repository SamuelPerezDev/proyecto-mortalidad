version: "3.8"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak-mortalidad
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/realm-mortalidad.json
    volumes:
      - ./keycloak/realm-mortalidad.json:/opt/keycloak/data/import/realm-mortalidad.json
    command: start-dev --import-realm
